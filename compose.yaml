services:
  backend:
    build:
      context: .
      dockerfile: DockerFile
    container_name: backend
    command: python3 manage.py runserver 0.0.0.0:8000
    volumes:
      - ./core:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=test
      - ALLOWED_HOSTS=localhost, 127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"